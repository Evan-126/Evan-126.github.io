<div class="slideshow-container">
  {% for project in include.projects %}
    <div class="slide">
      <a href="{{ project.page }}">
        <img src="{{ project.cover_image }}" alt="{{ project.name }}" style="width:100%">
      </a>
      <div class="caption">{{ project.name }}</div>
    </div>
  {% endfor %}
  <a class="prev" onclick="moveSlide(-1)">&#10094;</a>
  <a class="next" onclick="moveSlide(1)">&#10095;</a>
</div>
<script>
let slideIdx = 1;
showSlides(slideIdx);
function moveSlide(n) { showSlides(slideIdx += n); }
function showSlides(n) {
  var i;
  var slides = document.getElementsByClassName("slide");
  if (n > slides.length) {slideIdx = 1}    
  if (n < 1) {slideIdx = slides.length}
  for (i = 0; i < slides.length; i++) {
    slides[i].style.display = "none";  
  }
  slides[slideIdx-1].style.display = "block";  
}
</script>
<style>
.slideshow-container { position:relative; max-width:600px; margin:auto; }
.slide { display:none; }
.prev, .next {
  cursor:pointer; position:absolute; top:50%; width:auto; padding:16px; 
  color:white; font-weight:bold; font-size:18px; transition:0.6s ease;
  border-radius:0 3px 3px 0; user-select:none;
}
.next { right:0; border-radius:3px 0 0 3px; }
.caption { text-align:center; background:rgba(0,0,0,0.5); color:white; }
</style>
